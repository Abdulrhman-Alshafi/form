<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- css -->
    <link rel="stylesheet" href="style.css" />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital@1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital@1&amp;,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <title>Document</title>
  </head>
  <body>
    <!-- container start -->
    <div class="container">
      <form class="form" id="form">
        <h2>Registration</h2>
        <div class="form-control">
          <label for="username"><b>Username</b></label>
          <input type="text" id="username" placeholder="Enter Username" />
          <small><b>Error message</b></small>
        </div>
        <div class="form-control">
          <label for="email"><b>Email</b></label>
          <input type="email" id="email" placeholder="Enter Email" />
          <small><b>Error message</b></small>
        </div>
        <div class="form-control">
          <label for="password"> <b> Password</b></label>
          <input type="password" id="password" placeholder="Enter Password" />
          <small><b>Error message</b></small>
        </div>
        <div class="form-control">
          <label for="password2"><b>Confirm Password</b></label>
          <input
            type="password"
            id="password2"
            placeholder="Enter password again"
          />
          <small><b>Error message</b></small>
        </div>
        <button>Submit</button>
      </form>
    </div>
    <!-- container end -->
  </body>
  <!-- js -->
  <script src="script.js"></script>
</html>
